spring.application.name=dvoranko-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH2_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH2_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email




mailgun.api.key=${MAILGUN_API_KEY}
mailgun.domain=sandbox3d80676ad70f4f4fbe8ba523ef6a9d06.mailgun.org
mailgun.sender=noreply@sandbox3d80676ad70f4f4fbe8ba523ef6a9d06.mailgun.org

leprogi.dvoranko.url=http://localhost:5173
#leprogi.dvoranko.url=https://dvoranko.onrender.com

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3


cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


logging.level.root=INFO
logging.level.fer.leprogi.dvoranko.service=DEBUG

#spring.profiles.active=test