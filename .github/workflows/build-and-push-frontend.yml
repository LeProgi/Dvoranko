name: Build and Push Frontend Image

on:
  push:
    branches:
      - master
      - deoploy-proba-url-rjesenje
    paths:
      - 'source_code/frontend/dvoranko-frontend/**'      # Trigger only on changes in the /frontend directory
  workflow_dispatch:

jobs:
  build-and-push-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    env:
      FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}

    steps:
      - name: Clone the repository
        uses: actions/checkout@v3

      - name: Set Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: 'source_code/frontend/dvoranko-frontend/yarn.lock'

      - name: Yarn install
        run: yarn install
        working-directory: source_code/frontend/dvoranko-frontend/

      - name: Yarn build
        run: yarn run build
        working-directory: source_code/frontend/dvoranko-frontend/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./source_code/frontend/dvoranko-frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/source_code/frontend/dvoranko-frontend:latest

      - name: Trigger release
        if: ${{ env.FRONTEND_DEPLOY_HOOK }}
        run: curl ${{ env.FRONTEND_DEPLOY_HOOK }}